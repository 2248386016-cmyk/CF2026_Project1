factors:
  momentum_20:
    display_name: "20日动量"
    family: "动量"
    hypothesis: "中短期强势可能延续"
    formula: "close_adj_t / close_adj_t_minus_20 - 1"
    fields: [close_adj]
    window: "20个连续交易日"
    direction: "越高越好"
    missing_rule: "历史不足20日或窗口含停牌/ST/无效行情则缺失"
    failure_risk: "趋势快速反转或动量崩溃"
  reversal_5:
    display_name: "5日反转"
    family: "反转"
    hypothesis: "短期过度反应可能修复"
    formula: "-(close_adj_t / close_adj_t_minus_5 - 1)"
    fields: [close_adj]
    window: "5个连续交易日"
    direction: "越高越好"
    missing_rule: "历史不足5日或窗口不连续则缺失"
    failure_risk: "强趋势行情"
  low_volatility_20:
    display_name: "20日低波动"
    family: "风险"
    hypothesis: "低波动股票可能更稳定"
    formula: "-std(daily_return, 20)"
    fields: [close_adj]
    window: "20个连续日收益"
    direction: "越高越好"
    missing_rule: "有效日收益不足20个则缺失"
    failure_risk: "高风险偏好或急涨行情"
  momentum_60_skip_5:
    display_name: "60日跳过最近5日动量"
    family: "动量"
    hypothesis: "中期趋势可能延续，跳过近期反转"
    formula: "close_adj_t_minus_5 / close_adj_t_minus_60 - 1"
    fields: [close_adj]
    window: "60个连续交易日，跳过最近5日"
    direction: "越高越好"
    missing_rule: "60日窗口不完整则缺失"
    failure_risk: "趋势切换或行情反转"
  overnight_reversal_5:
    display_name: "5日隔夜反转"
    family: "隔夜反转"
    hypothesis: "近期隔夜涨幅过大可能回调"
    formula: "-sum(log(open_adj_t / close_adj_t_minus_1), 5)"
    fields: [open_adj, close_adj]
    window: "5个连续有效隔夜"
    direction: "越高越好"
    missing_rule: "停牌、ST或非连续交易日不跨过计算"
    failure_risk: "持续信息驱动的跳空趋势"
  amihud_illiquidity_20:
    display_name: "20日Amihud非流动性"
    family: "流动性"
    hypothesis: "承担非流动性可能需要更高收益补偿"
    formula: "log(mean(abs(daily_return) / amount, 20))"
    fields: [close_adj, amount]
    window: "20个连续交易日"
    direction: "越高代表越非流动"
    missing_rule: "收益缺失或成交额非正则缺失"
    failure_risk: "交易成本吞噬溢价或小盘股混杂"
  amount_change_5_20:
    display_name: "5/20日成交活跃度变化"
    family: "价量"
    hypothesis: "近期放量可能表示新信息进入市场"
    formula: "log(mean(amount, 5) / mean(amount, 20))"
    fields: [amount]
    window: "5日与20日"
    direction: "越高代表近期放量越明显"
    missing_rule: "20日窗口不完整或成交额非正则缺失"
    failure_risk: "投机放量后反转"
